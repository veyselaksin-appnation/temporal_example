version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup
    ports:
      - "7233:7233"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=temporal
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - temporal
      - text2text
      - web_search
    environment:
      - TEMPORAL_ADDRESS=temporal:7233

  text2text:
    build:
      context: .
      dockerfile: apps/microservices/text2text/Dockerfile
    ports:
      - "3001:3001"

  web_search:
    build:
      context: .
      dockerfile: apps/microservices/web_search/Dockerfile
    ports:
      - "3002:3002"
